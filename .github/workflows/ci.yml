on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

name: CI

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true

      - name: Check formatting (gofumpt)
        run: |
          files=$(go run mvdan.cc/gofumpt@latest -l .)
          if [ -n "${files}" ]; then
            echo "run gofumpt -w on:"
            echo "${files}"
            exit 1
          fi

      - name: Check go.mod tidy
        run: go mod tidy -diff

      # go generate writes the Go code of the templates, static/style.min.css
      # and the Morpheus bundle, which go install and go get take as committed.
      - name: Check generated code is current
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "run go generate ./... and commit:"
            git status --porcelain
            git diff
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      # The tests build example/library, whose releases come from its tags.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go 1.27.3
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true

      - name: Run tests
        run: go test -timeout 5m -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Compile
        run: go build -o /dev/null ./...
