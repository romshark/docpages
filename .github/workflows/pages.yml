name: Deploy GitHub Pages

# The site is docs/ built by the docpages of the same commit, with each
# example below example/. 1 build writes main and every release from its Git
# tag, so each push to main deploys the whole site. A change of docpages
# itself changes the site too.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # The releases of example/library come from its tags.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true

      # A build replaces only main/, the release folders, index.html and
      # llms.txt of its output folder, which leaves site/example/ alone.
      - name: Build the docs and the examples
        run: |
          go run ./cmd/docpages -o site docs
          go run ./cmd/docpages -o site/example/cli example/cli/docs
          go run ./cmd/docpages -o site/example/library example/library/docs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
