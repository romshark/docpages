name: govulncheck
# The schedule catches new vulnerabilities.
# GitHub ignores paths filters on tag pushes.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/govulncheck.yml"
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/govulncheck.yml"
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
