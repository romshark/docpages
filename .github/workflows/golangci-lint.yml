name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: false
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
